spring:
  application:
    name: vehicle-management-api
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  secret: ${SECRET_JWT}
  expiration: 1800000 # 30 min

app:
  admin-username: ${ADMIN_USERNAME}
  admin-password: ${ADMIN_PASSWORD}