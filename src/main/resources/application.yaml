spring:
  application:
    name: vehicle-management-api
  datasource:
    url: ${URL_DB}
    username: ${USER_DB}
    password: ${PASSWORD_DB}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  secret: ${SECRET_JWT}
  expiration: 1800000 # 30 min

app:
  admin-username: ${ADMIN_USERNAME}
  admin-password: ${ADMIN_PASSWORD}

